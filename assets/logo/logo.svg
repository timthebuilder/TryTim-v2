<svg width="640" height="340" viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .green { fill: #1F3B32; }
      .brass { fill: #B08D57; }
      .brass-stroke { stroke: #B08D57; }
      .wordmark { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; }
      .banner-text { font-family: 'Jost', Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <rect width="640" height="340" fill="#F1EDE4"/>

  <!-- plaque border with corner brackets -->
  <rect x="40" y="40" width="560" height="260" fill="none" stroke="#B08D57" stroke-width="1.5"/>
  <path d="M 52 52 L 52 68 M 52 52 L 68 52" class="brass-stroke" stroke-width="2" fill="none"/>
  <path d="M 588 52 L 588 68 M 588 52 L 572 52" class="brass-stroke" stroke-width="2" fill="none"/>
  <path d="M 52 288 L 52 272 M 52 288 L 68 288" class="brass-stroke" stroke-width="2" fill="none"/>
  <path d="M 588 288 L 588 272 M 588 288 L 572 288" class="brass-stroke" stroke-width="2" fill="none"/>

  <!-- minimal ladder silhouette -->
  <g transform="translate(320,95)">
    <line x1="-11" y1="-28" x2="-11" y2="28" stroke="#1F3B32" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="11" y1="-28" x2="11" y2="28" stroke="#1F3B32" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-11" y1="-16" x2="11" y2="-16" class="brass-stroke" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-11" y1="-2" x2="11" y2="-2" class="brass-stroke" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-11" y1="12" x2="11" y2="12" class="brass-stroke" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="320" y="185" text-anchor="middle" class="wordmark" font-size="64" letter-spacing="4">
    <tspan class="green">TRY</tspan><tspan class="brass">TIM</tspan>
  </text>

  <!-- rule -->
  <line x1="290" y1="205" x2="350" y2="205" class="brass-stroke" stroke-width="1.5"/>

  <!-- banner subtitle -->
  <text x="320" y="235" text-anchor="middle" class="banner-text green" font-size="15" letter-spacing="3">
    BUILDING &amp; MAINTENANCE SERVICES
  </text>

  <text x="320" y="265" text-anchor="middle" class="banner-text" font-size="11" letter-spacing="2" fill="#6b6558">
    MALLORCA
  </text>
</svg>
